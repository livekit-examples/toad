<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dot App Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — conversation column with the Dot orb and talk button, task rail on the right; stacks on phones */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --surface-2: #EDF0F6; --line: #DAE0EA;
  --fg: #131A26; --muted: #5A6477;
  --accent: #2F5BFF; --accent-soft: #E4EAFF; --on-accent: #FFFFFF;
  --run: #A86300; --run-soft: #FFF0D9;
  --ok: #1D7F47; --ok-soft: #E0F3E7;
  --bad: #B8362D; --bad-soft: #FBE5E3;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1117; --surface: #151B24; --surface-2: #1C2330; --line: #29313F;
  --fg: #E7EBF2; --muted: #97A1B2;
  --accent: #7C97FF; --accent-soft: #1D294F; --on-accent: #0D1117;
  --run: #F0B446; --run-soft: #37290F;
  --ok: #4DC47F; --ok-soft: #12301F;
  --bad: #FF7B71; --bad-soft: #3B1916;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1117; --surface: #151B24; --surface-2: #1C2330; --line: #29313F;
  --fg: #E7EBF2; --muted: #97A1B2;
  --accent: #7C97FF; --accent-soft: #1D294F; --on-accent: #0D1117;
  --run: #F0B446; --run-soft: #37290F;
  --ok: #4DC47F; --ok-soft: #12301F;
  --bad: #FF7B71; --bad-soft: #3B1916;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.top-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding: 20px 16px 32px; }
.shell { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; }
.brand-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
.mock-tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); padding: 2px 8px; border-radius: 999px; }
.conn { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.conn b { font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--fg); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }

.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }

/* Conversation */
.convo { display: flex; flex-direction: column; min-height: 640px; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 16px 18px; border-bottom: 1px solid var(--line); }
.orb-wrap { width: 132px; height: 132px; display: grid; place-items: center; position: relative; }
.orb { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); transition: transform 160ms ease, background 300ms ease; }
.orb-ring { position: absolute; inset: 10px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; }
.stage.listening .orb-ring { animation: ring 1.4s ease-out infinite; }
.stage.thinking .orb { background: var(--muted); animation: breathe 1.2s ease-in-out infinite; }
.stage.idle .orb { animation: breathe 4s ease-in-out infinite; }
@keyframes ring { from { transform: scale(0.75); opacity: 0.7; } to { transform: scale(1.12); opacity: 0; } }
@keyframes breathe { 0%, 100% { transform: scale(0.94); } 50% { transform: scale(1); } }
.state-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stage h2 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 20px; text-wrap: balance; text-align: center; }

.messages { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 18px; overflow-y: auto; max-height: 420px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14.5px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg.dot { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg .via { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.msg.user .via { color: inherit; opacity: 0.8; }
.tool { align-self: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%; overflow-wrap: anywhere; }
.tool b { color: var(--accent); font-weight: 500; }

.composer { display: flex; align-items: center; gap: 12px; padding: 14px 18px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.mic { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; flex: none; transition: transform 120ms ease; }
.mic:hover { transform: scale(1.04); }
.mic:focus-visible, .tab:focus-visible, .task-head:focus-visible, .text-in:focus-visible, .ghost:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mic[aria-pressed="true"] { background: var(--bad); }
.mic svg { width: 26px; height: 26px; }
.compose-text { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 6px; }
.text-row { display: flex; gap: 8px; }
.text-in { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.ghost { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.hint { font-size: 12px; color: var(--muted); }

/* Tasks */
.tasks-head { padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
.tasks-head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.tally { font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 6px; }
.tab { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.tab .n { font-family: var(--font-mono); font-weight: 500; margin-left: 4px; }
.task-list { display: flex; flex-direction: column; }
.empty { padding: 28px 18px; color: var(--muted); font-size: 14px; }

.task { border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.task-head { width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; padding: 14px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.task-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.task h3 { margin: 0; font-size: 15.5px; font-weight: 600; }
.meta { font-size: 12.5px; color: var(--muted); }
.pill { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.queued { background: var(--surface-2); color: var(--muted); }
.pill.running { background: var(--run-soft); color: var(--run); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.needs { background: var(--run-soft); color: var(--run); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 4px; }
.step { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
.step i { height: 4px; border-radius: 2px; background: var(--surface-2); }
.step.done i { background: var(--accent); }
.step.now i { background: var(--run); }
.step.now { color: var(--fg); }

.task-body { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.summary { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.summary p { margin: 0; font-size: 14px; }
.summary.pending p { color: var(--muted); }
.transcript { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.line { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; }
.line .who { font-weight: 600; color: var(--muted); font-size: 12px; padding-top: 1px; }
.line.agent .who { color: var(--accent); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.timeline li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
.timeline time { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }

/* Incoming callback banner */
.call-banner { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; width: min(420px, calc(100% - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,0.25); z-index: 5; }
.call-banner .brand-dot { flex: none; animation: breathe 0.9s ease-in-out infinite; }
.call-banner div { display: flex; flex-direction: column; min-width: 0; }
.call-banner strong { font-size: 14.5px; }
.call-banner span { font-size: 12.5px; opacity: 0.75; font-family: var(--font-mono); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-dot" aria-hidden="true"></span>Dot <span class="mock-tag">Mockup</span></div>
    <div class="top-right">
      <div class="conn"><span class="live" aria-hidden="true"></span>Connected to <b>room dot-chad-7f3</b></div>
      <button class="ghost" id="reset" title="Shortcut: R">Reset demo</button>
    </div>
  </header>

  <main class="grid">
    <section class="panel convo" aria-label="Conversation with Dot">
      <div class="stage idle" id="stage">
        <div class="orb-wrap" aria-hidden="true"><div class="orb-ring"></div><div class="orb" id="orb"></div></div>
        <div class="state-label" id="stateLabel">Ready</div>
        <h2 id="stageLine">Hi Chad. What can I take off your plate?</h2>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <div class="composer">
        <button class="mic" id="mic" aria-pressed="false" aria-label="Tap to talk to Dot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </button>
        <div class="compose-text">
          <form class="text-row" id="textForm">
            <input class="text-in" id="textIn" type="text" placeholder="Or type to Dot" autocomplete="off" aria-label="Message Dot">
            <button class="ghost" type="submit">Send</button>
          </form>
          <span class="hint">Mockup: tapping the mic plays a scripted reservation request from start to callback.</span>
        </div>
      </div>
    </section>

    <section class="panel" aria-label="Tasks">
      <div class="tasks-head">
        <h2>Tasks</h2>
        <div class="tally" id="tally"></div>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tabActive" aria-selected="true">Active<span class="n" id="nActive"></span></button>
          <button class="tab" role="tab" id="tabDone" aria-selected="false">Completed<span class="n" id="nDone"></span></button>
        </div>
      </div>
      <div class="task-list" id="taskList" role="tabpanel"></div>
    </section>
  </main>
</div>

<div class="call-banner" id="callBanner" hidden role="status">
  <span class="brand-dot" aria-hidden="true"></span>
  <div><strong>Dot is calling you back</strong><span>+1 (305) 555-0142 · Casa Nopal booking</span></div>
</div>

<script>
(() => {
  const MIN = 60000, now = Date.now();
  const fmt = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  // Reset bumps `gen`; timers from an older run never resolve, so a running demo just stops.
  let gen = 0;
  const sleep = ms => { const g = gen; return new Promise(r => setTimeout(() => { if (g === gen) r(); }, ms)); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const seed = () => { const now = Date.now(); return {
    filter: 'active',
    open: new Set(['t-luigi']),
    fresh: null,
    busy: false,
    messages: [
      { who: 'dot', via: 'Voice · 5:48 PM', text: "Sushi Kaito is booked for Saturday. I'm on the phone with Luigi's right now for tonight." },
    ],
    tasks: [
      {
        id: 't-luigi', title: "Table for 2 at Luigi's Trattoria", when: 'Tonight 7:30 PM', created: now - 3 * MIN, started: now - 80000,
        status: 'running', phase: 2, callback: 'pending',
        summary: null,
        transcript: [
          ['agent', "Hi, I'm an AI assistant calling to book a table for Chad."],
          ['host', 'Sure, for when?'],
          ['agent', 'Tonight at 7:30, for two people.'],
          ['host', 'Let me check the book, one second.'],
        ],
        events: [
          [now - 3 * MIN, 'Task created from your voice request'],
          [now - 3 * MIN + 4000, 'Caller agent dialing +1 (305) 555-0188'],
          [now - 80000, "Connected to Luigi's Trattoria"],
        ],
      },
      {
        id: 't-kaito', title: 'Table for 4 at Sushi Kaito', when: 'Sat 8:00 PM', created: now - 52 * MIN, started: now - 51 * MIN,
        status: 'ok', outcome: 'Confirmed', phase: 4, callback: 'delivered',
        summary: 'Booked Saturday at 8:00 PM for 4 under Chad. They asked for a card to hold the table; I said you would pay on arrival, and they were fine with that.',
        transcript: [],
        events: [
          [now - 52 * MIN, 'Task created from your voice request'],
          [now - 51 * MIN, 'Called Sushi Kaito, 2 min 40 s'],
          [now - 48 * MIN, 'Result: confirmed for Sat 8:00 PM'],
          [now - 47 * MIN, 'Called you back, delivered'],
        ],
      },
      {
        id: 't-farolito', title: 'Table for 2 at El Farolito', when: 'Fri 7:00 PM', created: now - 95 * MIN, started: now - 94 * MIN,
        status: 'needs', outcome: 'Needs you', phase: 4, callback: 'delivered',
        summary: 'Friday at 7:00 PM was full. They offered 9:15 PM, which is outside the 30 minutes you gave me, so I did not book it. Say "take the 9:15" and I will call them back.',
        transcript: [],
        events: [
          [now - 95 * MIN, 'Task created from your voice request'],
          [now - 94 * MIN, 'Called El Farolito, 1 min 55 s'],
          [now - 92 * MIN, 'Result: alternative offered, 9:15 PM'],
          [now - 91 * MIN, 'Called you back, delivered'],
        ],
      },
    ],
  }; };
  let state = seed();

  const $ = id => document.getElementById(id);
  const isActive = t => t.status === 'queued' || t.status === 'running' || (t.phase < 4);
  const STEPS = ['Queued', 'Calling', 'Result', 'Called you back'];

  function pillFor(t) {
    if (t.status === 'queued') return '<span class="pill queued">Queued</span>';
    if (t.status === 'running') {
      if (t.phase === 1) return '<span class="pill running">Dialing</span>';
      if (t.phase === 2) return `<span class="pill running" data-elapsed="${t.started}">On call · ${elapsed(t.started)}</span>`;
      if (t.phase === 3) return '<span class="pill running">Calling you back</span>';
    }
    if (t.status === 'ok') return `<span class="pill ok">${esc(t.outcome)}</span>`;
    if (t.status === 'needs') return `<span class="pill needs">${esc(t.outcome)}</span>`;
    return `<span class="pill bad">${esc(t.outcome || 'Failed')}</span>`;
  }
  function elapsed(t) { const s = Math.max(0, Math.floor((Date.now() - t) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

  function stepsFor(t) {
    return '<div class="steps" aria-hidden="true">' + STEPS.map((name, i) => {
      const cls = i < t.phase ? 'done' : (i === t.phase && t.phase < 4 ? 'now' : '');
      return `<div class="step ${cls}"><i></i>${name}</div>`;
    }).join('') + '</div>';
  }

  function renderTasks() {
    const active = state.tasks.filter(isActive), done = state.tasks.filter(t => !isActive(t));
    $('nActive').textContent = active.length; $('nDone').textContent = done.length;
    const onCall = active.filter(t => t.status === 'running').length, queued = active.filter(t => t.status === 'queued').length;
    $('tally').textContent = `${onCall} running · ${queued} queued · ${done.length} finished today`;
    $('tabActive').setAttribute('aria-selected', state.filter === 'active');
    $('tabDone').setAttribute('aria-selected', state.filter === 'done');
    const list = (state.filter === 'active' ? active : done).sort((a, b) => b.created - a.created);
    if (!list.length) {
      $('taskList').innerHTML = `<div class="empty">${state.filter === 'active' ? 'Nothing running. Ask Dot to make a call and it shows up here.' : 'Finished tasks land here with what Dot did.'}</div>`;
      return;
    }
    $('taskList').innerHTML = list.map(t => {
      const open = state.open.has(t.id);
      const summary = t.summary
        ? `<div class="summary"><span class="label">What Dot did</span><p>${esc(t.summary)}</p></div>`
        : `<div class="summary pending"><span class="label">What Dot did</span><p>Still working. Dot will write this up when the call ends.</p></div>`;
      const transcript = t.transcript.length
        ? `<div class="label">${t.status === 'running' && t.phase === 2 ? 'Live call' : 'Call transcript'}</div><div class="transcript">${t.transcript.map(([w, s]) => `<div class="line ${w}"><span class="who">${w === 'agent' ? 'Dot' : 'Restaurant'}</span><span>${esc(s)}</span></div>`).join('')}</div>`
        : '';
      const timeline = `<div class="label">Timeline</div><ol class="timeline">${t.events.map(([ts, s]) => `<li><time>${fmt(ts)}</time><span>${esc(s)}</span></li>`).join('')}</ol>`;
      return `<article class="task ${state.fresh === t.id ? 'fresh' : ''}">
        <button class="task-head" data-id="${t.id}" aria-expanded="${open}">
          <div class="task-top"><h3>${esc(t.title)}</h3>${pillFor(t)}</div>
          <div class="meta">Reservation call · ${esc(t.when)} · asked at ${fmt(t.created)}</div>
          ${stepsFor(t)}
        </button>
        <div class="task-body" ${open ? '' : 'hidden'}>${summary}${transcript}${timeline}</div>
      </article>`;
    }).join('');
  }

  function renderMessages() {
    $('messages').innerHTML = state.messages.map(m => m.who === 'tool'
      ? `<div class="tool"><b>${esc(m.name)}</b> ${esc(m.text)}</div>`
      : `<div class="msg ${m.who}"><span class="via">${esc(m.via)}</span>${esc(m.text)}</div>`).join('');
    $('messages').scrollTop = $('messages').scrollHeight;
  }

  function setStage(mode, label, line) {
    $('stage').className = 'stage ' + mode;
    $('stateLabel').textContent = label;
    if (line) $('stageLine').textContent = line;
  }

  let speakTimer = null;
  function speaking(on) {
    clearInterval(speakTimer);
    if (!on) { $('orb').style.transform = ''; return; }
    speakTimer = setInterval(() => { $('orb').style.transform = `scale(${0.9 + Math.random() * 0.22})`; }, 110);
  }

  $('taskList').addEventListener('click', e => {
    const head = e.target.closest('.task-head'); if (!head) return;
    const id = head.dataset.id; state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    state.fresh = null; renderTasks();
  });
  $('tabActive').addEventListener('click', () => { state.filter = 'active'; state.fresh = null; renderTasks(); });
  $('tabDone').addEventListener('click', () => { state.filter = 'done'; state.fresh = null; renderTasks(); });

  $('textForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('textIn').value.trim(); if (!v || state.busy) return;
    $('textIn').value = '';
    state.messages.push({ who: 'user', via: 'Typed · ' + fmt(Date.now()), text: v }); renderMessages();
    setStage('thinking', 'Thinking'); await sleep(700);
    state.messages.push({ who: 'dot', via: 'Dot · ' + fmt(Date.now()), text: 'In the full build I would act on that. In this mockup, tap the mic to watch a reservation run from request to callback.' });
    renderMessages(); setStage('idle', 'Ready');
  });

  setInterval(() => {
    document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = 'On call · ' + elapsed(Number(el.dataset.elapsed)); });
  }, 1000);

  async function typeInto(msg, full) {
    for (let i = 1; i <= full.length; i += 3) { msg.text = full.slice(0, i); renderMessages(); await sleep(28); }
    msg.text = full; renderMessages();
  }

  async function runDemo() {
    if (state.busy) return; state.busy = true;
    const mic = $('mic'); mic.setAttribute('aria-pressed', 'true');
    setStage('listening', 'Listening', 'Go ahead, I’m listening.');
    const ask = "Can you call Casa Nopal and book a table for six tonight at 6? Call me back when it's confirmed.";
    const u = { who: 'user', via: 'Voice · ' + fmt(Date.now()), text: '' }; state.messages.push(u);
    await typeInto(u, ask);
    mic.setAttribute('aria-pressed', 'false');
    setStage('thinking', 'Thinking'); await sleep(900);
    state.messages.push({ who: 'tool', name: 'make_reservation_call', text: 'Casa Nopal · 6 people · today 6:00 PM · callback: call me' });
    renderMessages(); await sleep(500);

    const t = {
      id: 't-nopal', title: 'Table for 6 at Casa Nopal', when: 'Tonight 6:00 PM', created: Date.now(), started: null,
      status: 'queued', phase: 0, callback: 'pending', summary: null, transcript: [],
      events: [[Date.now(), 'Task created from your voice request']],
    };
    state.tasks = state.tasks.filter(x => x.id !== 't-nopal'); state.tasks.push(t); state.open = new Set(['t-nopal']); state.filter = 'active'; state.fresh = t.id; renderTasks();

    setStage('speaking', 'Speaking', 'On it. I’ll ring you when they confirm.'); speaking(true);
    state.messages.push({ who: 'dot', via: 'Dot · ' + fmt(Date.now()), text: "On it. I'll call Casa Nopal for a table for six at 6 and call you back when they confirm." });
    renderMessages(); await sleep(2200); speaking(false);
    setStage('idle', 'Ready', 'Anything else while I work on that?');

    await sleep(1200);
    t.status = 'running'; t.phase = 1; t.events.push([Date.now(), 'Caller agent dialing +52 998 555 0117']); state.fresh = null; renderTasks();
    await sleep(1600);
    t.phase = 2; t.started = Date.now(); t.events.push([Date.now(), 'Connected to Casa Nopal']); renderTasks();
    const lines = [
      ['agent', "Hi, I'm an AI assistant calling to book a table for Chad."],
      ['host', 'Claro. For how many, and when?'],
      ['agent', 'Six people, tonight at 6:00.'],
      ['host', 'We have 6:00 on the terrace. Name?'],
      ['agent', 'Chad. Terrace is great, thank you.'],
      ['host', "You're set. We hold tables for 15 minutes."],
    ];
    for (const l of lines) { await sleep(1300); t.transcript.push(l); renderTasks(); }
    await sleep(900);
    t.events.push([Date.now(), 'Call ended, 0 min ' + Math.round((Date.now() - t.started) / 1000) + ' s']);
    t.events.push([Date.now(), 'Result: confirmed for tonight 6:00 PM']);
    t.summary = "Booked Casa Nopal tonight at 6:00 PM for 6 under Chad, on the terrace. They hold tables for 15 minutes, so aim to be there by 6:15.";
    t.phase = 3; t.callback = 'in_progress'; t.events.push([Date.now(), 'Calling you back at +1 (305) 555-0142']); renderTasks();

    await sleep(900);
    $('callBanner').hidden = false; await sleep(2000); $('callBanner').hidden = true;
    setStage('speaking', 'On the phone with you', 'You’re booked at Casa Nopal.'); speaking(true);
    state.messages.push({ who: 'dot', via: 'Phone callback · ' + fmt(Date.now()), text: "Good news: you're booked at Casa Nopal tonight at 6:00 for six, on the terrace. They hold it 15 minutes." });
    renderMessages(); await sleep(2600); speaking(false);

    t.phase = 4; t.status = 'ok'; t.outcome = 'Confirmed'; t.callback = 'delivered';
    t.events.push([Date.now(), 'Called you back, delivered']);
    state.filter = 'done'; state.fresh = t.id; renderTasks();
    setStage('idle', 'Ready', 'Done. Anything else?');
    state.busy = false;
  }

  function resetDemo() {
    gen++; speaking(false);
    state = seed();
    $('callBanner').hidden = true;
    $('mic').setAttribute('aria-pressed', 'false');
    $('textIn').value = '';
    setStage('idle', 'Ready', 'Hi Chad. What can I take off your plate?');
    renderMessages(); renderTasks();
  }

  $('mic').addEventListener('click', runDemo);
  $('reset').addEventListener('click', resetDemo);
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'r' || e.key === 'R') resetDemo();
  });
  renderMessages(); renderTasks();
})();
</script>
</body>
</html>
